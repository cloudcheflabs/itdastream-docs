site_name: ItdaStream
site_url: https://cloudcheflabs.github.io/itdastream-docs
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - header.autohide
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: custom
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: custom
      accent: lime
  logo: images/logo/itdastream-logo-without-name.png
  favicon: images/logo/itdastream-logo-without-name.png


nav:
  - "Architecture":
      - "itdastream Architecture": architecture/architecture.md
  - "Installation": installation/installation.md
  - "Streaming":
      - "Overview": features/streaming.md
      - "No-Code Kafka to Iceberg": features/streaming-no-code.md
      - "Connection Registry": features/connections.md
      - "Streaming SDK": features/streaming-sdk.md
      - "Tutorial: Submit a Job (Token + Uber-JAR)": features/streaming-job-tutorial.md
      - "Job Logs, Kill & Iceberg Sinks": features/streaming-job-logs.md
      - "Iceberg Write-Audit-Publish (WAP)": features/iceberg-wap.md
      - "Operations & Tuning": features/streaming-operations.md
  - "Features":
      - "Full Kafka Protocol Compatibility": features/kafka-compatible.md
      - "Disaggregated Compute-Storage Architecture": features/disaggre-architecture.md
      - "Exactly-Once Transactional Semantics": features/tx.md
      - "Consumer Group Coordination": features/consumer-group.md
      - "Envelope Encryption and Key Management Service": features/kms.md
      - "AWS IAM-Compatible Access Control": features/iam.md
      - "IAM Policy Reference": features/iam-policy.md
      - "Admin Password Recovery": features/admin-password-recovery.md
      - "SASL Authentication and TLS Encryption": features/sasl.md
      - "High-Performance NIO Network Layer": features/network.md
      - "Intelligent Segment Caching": features/caching.md
      - "Log Retention and Lifecycle Management": features/retention.md
      - "Monitoring and Metrics": features/monitoring.md
      - "Network Compression": features/compression.md
      - "Flexible Configuration System": features/configuration.md
      - "Crash Recovery with Staging Store": features/staging-store.md
      - "Backup & Restore": features/backup.md


extra:
  generator: false
  version:
    provider: mike
    default: 2.2.0


extra_javascript:
  - javascripts/extra.js


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: |
  © <script>document.write(new Date().getFullYear())</script> Cloud Chef Labs, Inc. All rights reserved. <a href="mailto:admin@cloudchef-labs.com">admin@cloudchef-labs.com</a>      - "NIC Silent-Fail Safety": features/nic-fail-safety.md
